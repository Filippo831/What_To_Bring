<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What To Bring - demo</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>What To Bring</h1>
  <p>Upload a GPX track plus your personal and hike information to get a clothing recommendation.</p>
</header>

<main>
  <section id="form-section">
    <form id="estimate-form">
      <label for="gpx">GPX file *</label>
      <input type="file" id="gpx" name="gpx" accept=".gpx,application/gpx+xml,text/xml" required>

      <label for="personal">Personal information (JSON) *</label>
      <textarea id="personal" name="personal_information" rows="12" spellcheck="false">{
  "name": "Mario",
  "surname": "Rossi",
  "mail": "mario.rossi@example.com",
  "age": 25,
  "gender": "male",
  "heat_tolerance": 3,
  "wardrobe": [
    "Men's Hiking Synthetic SS T-Shirt MH500",
    "Men's Trekking Merino Wool LS T-Shirt MT500",
    "Men's Hiking T-Shirt MH100",
    "Men's Long-Sleeved Hiking T-Shirt MH500",
    "Men's Desert Trekking UV T-Shirt Desert 500",
    "Men's Hiking Fleece MH100",
    "Men's Hiking Fleece MH500",
    "Men's NH900 Sherpa Hiking Fleece",
    "Men's MH120 Hiking Fleece Zip",
    "Men's Waterproof Hiking Jacket MH500",
    "Men's Hiking Softshell MT500",
    "Men's Rain Jacket MH100",
    "Men's Ultra-Light Rain Jacket FH500",
    "Men's MT500 Down Puffer Jacket",
    "Men's Synthetic Padded Jacket MT100",
    "Men's Trekking Down Jacket MT900 (-18°C)",
    "Men's Hooded Hybrid Jacket MT500",
    "Men's Trekking 3-in-1 Jacket Travel 100"
  ]
}</textarea>

      <label for="hike">Hike information (JSON) *</label>
      <textarea id="hike" name="hike_information" rows="4" spellcheck="false">{
  "starting_time": "2026-05-27 09:00",
  "type": "hike"
}</textarea>

      <button type="submit">Estimate</button>
      <p id="status" class="status"></p>
    </form>
  </section>

  <section id="result-section" hidden>
    <h2>Recommendations</h2>
    <div id="strategy" class="strategy"></div>
    <div id="layers" class="layers"></div>

    <h2>Hike analysis</h2>
    <div id="features"></div>
  </section>
</main>

<script src="/static/demo.js"></script>
</body>
</html>
