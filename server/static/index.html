<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What To Bring - demo</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>What To Bring</h1>
  <p>Upload a GPX track, tell us about yourself and your wardrobe, and get a clothing recommendation.</p>
</header>

<main>
  <section id="form-section">
    <form id="estimate-form">
      <h3>1. GPX track</h3>
      <label for="gpx">GPX file *</label>
      <input type="file" id="gpx" name="gpx" accept=".gpx,application/gpx+xml,text/xml" required>

      <h3>2. Personal information</h3>
      <div class="grid">
        <label>Name <input id="name" type="text" value="Mario"></label>
        <label>Surname <input id="surname" type="text" value="Rossi"></label>
        <label>Email <input id="mail" type="email" value="mario.rossi@example.com"></label>
        <label>Age <input id="age" type="number" min="1" max="120" value="25"></label>
        <label>Gender
          <select id="gender">
            <option value="male" selected>male</option>
            <option value="female">female</option>
            <option value="other">other</option>
          </select>
        </label>
        <label>Heat tolerance (1 = very sensitive)
          <select id="heat-tolerance">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
      </div>

      <h3>3. My wardrobe</h3>
      <div class="wardrobe-toolbar">
        <input id="wardrobe-search" type="search" placeholder="Search clothes..." autocomplete="off">
        <button type="button" id="select-all">Select all</button>
        <button type="button" id="clear-all">Clear</button>
      </div>
      <div id="wardrobe-list" class="wardrobe-list"></div>
      <p id="wardrobe-count" class="count"></p>

      <h3>4. Hike information</h3>
      <div class="grid">
        <label>Starting time <input id="starting-time" type="datetime-local" value="2026-05-27T09:00"></label>
        <label>Type <input id="activity-type" type="text" value="hike"></label>
      </div>

      <button type="submit">Estimate</button>
      <p id="status" class="status"></p>
    </form>
  </section>

  <section id="result-section" hidden>
    <h2>Recommendations</h2>
    <div id="strategy" class="strategy"></div>
    <div id="layers" class="layers"></div>

    <h2>Hike analysis</h2>
    <div id="features"></div>
  </section>
</main>

<script src="/static/demo.js"></script>
</body>
</html>
